{{define "title"}}Herald - Select User{{end}}
{{define "content"}}
<main class="container u-b286b8">
    <article>
        <header><h2>Select User</h2></header>
        {{if .Users}}
        <nav>
            {{range .Users}}
            <a href="/u/{{.ID}}" role="button" class="outline u-3dbc90">
                {{.Name}}
            </a>
            {{end}}
        </nav>
        {{else}}
        <p class="empty-state">No users registered. Use the CLI to create a user.</p>
        {{end}}
    </article>
</main>
{{end}}
