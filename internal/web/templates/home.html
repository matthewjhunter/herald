{{define "title"}}Herald - {{.UserName}}{{end}}
{{define "nav"}}{{template "shared-nav" "home"}}{{end}}
{{define "content"}}
<div class="app-grid" id="app-grid">
    <aside class="sidebar" id="sidebar"
           hx-get="/sidebar" hx-trigger="feeds-changed from:body, every 300s" hx-swap="innerHTML">
        {{template "feed_sidebar_content" .}}
    </aside>
    <div class="sidebar-resize-handle" id="sidebar-resize-handle"></div>
    <div class="content-split">
        <div class="article-list-pane" id="article-list"
             hx-get="/articles" hx-trigger="load" hx-swap="innerHTML">
            <div class="empty-state">Loading articles...</div>
        </div>
        <div class="article-list-footer u-f12080">
            <button class="outline secondary mark-all-read-btn">Mark all as read</button>
            <button id="hide-read-btn" class="outline u-b7c697"></button>
            <button id="unsubscribe-feed-btn"
                    class="outline btn-sm btn-danger" hidden>
                Unsubscribe
            </button>
            <button id="mute-group-btn"
                    class="outline btn-sm btn-danger" hidden>
                Mute Topic
            </button>
            <button id="ungroup-btn"
                    class="outline btn-sm" hidden>
                Ungroup
            </button>
        </div>
        <div class="vertical-resize-handle" id="vertical-resize-handle"></div>
        <div class="reading-pane" id="reading-pane">
            <div class="empty-state">Select an article to read</div>
        </div>
    </div>
</div>
{{end}}
