<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Herald{{end}}</title>
    <!-- Pico CSS v2.1.1. Regenerate integrity when bumping the file:
         printf 'sha384-%s\n' "$(openssl dgst -sha384 -binary static/pico.min.css | openssl base64 -A)" -->
    <link rel="stylesheet" href="/static/pico.min.css?v={{assetVersion}}" integrity="sha384-L1dWfspMTHU/ApYnFiMz2QID/PlP1xCW9visvBdbEkOLkSSWsP6ZJWhPw6apiXxU" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/herald.css?v={{assetVersion}}">
    <script>
        (function() {
            var t = localStorage.getItem('herald-theme');
            if (t) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <div id="reconnect-banner" class="reconnect-banner" hidden>
        <span>Your session expired. Reconnect to keep reading -- your current article stays put until you do.</span>
        <button id="reconnect-btn" class="outline" type="button">Reconnect</button>
    </div>
    <header class="top-nav">
        <div style="display:flex;flex-direction:column;gap:0;">
            <h1 style="margin-bottom:0;"><a href="/" style="text-decoration:none;color:inherit;">Herald</a></h1>
            <span style="font-size:0.6rem;opacity:0.4;line-height:1;margin-top:0.15rem;">{{buildVersion}} · {{buildTime}}</span>
        </div>
        {{block "nav" .}}{{end}}
        <form class="nav-search" onsubmit="return false;">
            <svg class="nav-search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input type="search" name="q" placeholder="Search, or paste a URL to find who linked it"
                   hx-get="/search" hx-target="#article-list" hx-swap="innerHTML"
                   hx-trigger="input changed delay:300ms, search"
                   autocomplete="off">
        </form>
        <button id="theme-toggle" class="theme-toggle outline" aria-label="Toggle theme">☀</button>
    </header>
    {{block "content" .}}{{end}}
    <!-- htmx 2.0.4. Regenerate integrity when bumping the file:
         printf 'sha384-%s\n' "$(openssl dgst -sha384 -binary static/htmx.min.js | openssl base64 -A)" -->
    <script src="/static/htmx.min.js?v={{assetVersion}}" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <script src="/static/herald.js?v={{assetVersion}}"></script>
</body>
</html>
