# Docker compose unified config (TOML). Mounted at /etc/herald/config.docker.toml
# for both `herald daemon` and `herald serve`.

[database]
# 'postgres' is the compose service name.
path = "postgres://herald:herald@postgres:5432/herald?sslmode=disable"

# Embedding is via env (HERALD_EMBED_* or EMBEDDING_*); see config.toml.example.

[ollama]
base_url = "http://ollama:11434"
security_model = "gemma3:4b"
curation_model = "llama3.1:8b"

[grouping]
similarity_threshold = 0.75
cluster_threshold = 0.75
min_cluster_size = 2
recency_window_hours = 48

[thresholds]
interest_score = 8.0
# Threat scale (0 = clean, higher = worse). Articles pass at or below
# max_security_threat, are flagged for audit up to security_borderline_threat,
# and are hard-blocked above it.
max_security_threat = 3.0
security_borderline_threat = 6.0

[preferences]
keywords = []

# Web section — only read by `herald serve`.
[web]
addr = ":8080"

# [web.webauth] and [web.admin] are typically supplied by the real deployment
# (not committed here). For local docker testing with auth you would add:
#
# [web.webauth]
# issuer_url = "https://webauth.example.com/t/mytenant"
# client_id = "herald"
# callback_url = "https://herald.example.com/auth/callback"
#
# [web.admin]
# role = "admin"
# users = ["dev@example.com"]
#
# Optional public-landing-page analytics (off by default). Point at your own
# Umami instance; both keys required. See docs/analytics.md.
# [web.analytics]
# umami_src  = "https://umami.example.com/script.js"
# website_id = "00000000-0000-0000-0000-000000000000"
