database:
  # PostgreSQL DSN. 'postgres' is the compose service name.
  path: postgres://herald:herald@postgres:5432/herald?sslmode=disable
# Embedding configuration is read from environment variables, not YAML.
# Set EMBEDDING_BASE_URL and EMBEDDING_MODEL (or HERALD_EMBED_* to override
# just for herald). See README.md for the full env-var list.
ollama:
  base_url: http://ollama:11434
  security_model: gemma3:4b
  curation_model: llama3.1:8b
grouping:
  similarity_threshold: 0.75
  cluster_threshold: 0.75
  min_cluster_size: 2
  recency_window_hours: 48
thresholds:
  interest_score: 8.0
  security_score: 7.0
preferences:
  keywords: []
