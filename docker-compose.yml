services:
  postgres:
    # pgvector image (Postgres 16 + the vector extension) -- grouping/similarity
    # uses pgvector ANN (#186); stock postgres:16 lacks it. This single-node
    # compose runs Postgres as the superuser POSTGRES_USER, so the startup
    # migration's CREATE EXTENSION IF NOT EXISTS vector self-provisions. (The
    # shared homelab Postgres provisions the extension out-of-band instead,
    # because herald connects there as a non-superuser role.)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: herald
      POSTGRES_USER: herald
      POSTGRES_PASSWORD: herald
    volumes:
      - herald-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herald"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  herald-web:
    build: .
    command: herald serve --config /etc/herald/config.docker.toml --addr :8080
    volumes:
      # Unified TOML config shared with the daemon (web-only keys under [web]).
      - ./config:/etc/herald:ro
    environment:
      # Optional: supply DB DSN via env (overrides config). 'postgres' is the compose service.
      HERALD_DB_DSN: postgres://herald:herald@postgres:5432/herald?sslmode=disable
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  herald-fetcher:
    build: .
    command: herald daemon --config /etc/herald/config.docker.toml --interval 5m
    volumes:
      # Unified TOML; database.path points at the postgres service.
      - ./config:/etc/herald:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  herald-data:
  ollama-models:
