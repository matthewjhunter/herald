name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Decide whether to build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_changed: ${{ steps.changes.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # A push that changes nothing the image is built from -- docs, plans, CI
      # and dev tooling -- has nothing to build. "Not in the image" means
      # excluded by .dockerignore; see .github/scripts/deploy-scope. A release
      # tag always builds: it has to publish its version tags whatever the
      # last commit touched.
      # No pipes: a failure of either command has to fail the step. If it
      # did not, the output would be empty, the build would be skipped, and a
      # broken check would look like a green run with nothing to build.
      - name: Decide whether to build
        id: changes
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD~1 HEAD > "$RUNNER_TEMP/changed.txt"
          go run .github/scripts/deploy-scope/main.go < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/scope.txt"
          cat "$RUNNER_TEMP/scope.txt"
          cat "$RUNNER_TEMP/scope.txt" >> "$GITHUB_OUTPUT"

  docker:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.image_changed == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get build timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%MZ)" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/matthewjhunter/herald
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.ts.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
