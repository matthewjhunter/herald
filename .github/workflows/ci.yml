name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (Postgres 16 + the vector extension): grouping/similarity
        # runs as pgvector ANN now (#186). The stock postgres:16 image lacks the
        # extension. In CI the POSTGRES_USER role is a superuser, so the startup
        # migration's CREATE EXTENSION IF NOT EXISTS vector self-provisions.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: herald_test
          POSTGRES_USER: herald
          POSTGRES_PASSWORD: herald
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U herald"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HERALD_TEST_DB_DSN: postgres://herald:herald@localhost:5432/herald_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  # Shared Go CI: test, vet, fmt, lint, govulncheck, replace check, and the
  # full-history gitleaks secret scan.
  ci:
    uses: infodancer/workflows/.github/workflows/go-ci.yml@v0
    with:
      # The test job above needs a pgvector service container, which a
      # reusable workflow cannot take; it stays here.
      run_tests: false

  checks:
    name: Generated code & smoke coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: sqlc generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
          git diff --exit-code -- internal/storage/db || {
            echo "internal/storage/db is stale; run 'task sqlc' and commit the result."
            exit 1
          }
      - name: Smoke route coverage (warn)
        run: go tool smolder gate --manifest internal/web/smoke-manifest.json --mode warn
